name: release

# Push a tag like v1.0.0 to publish a GitHub Release with binaries.
# The tag must match `var Version` in pacproxy.go.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write # create the release and upload its files

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Tag matches Version
        run: |
          want="v$(make -s version)"
          if [ "$GITHUB_REF_NAME" != "$want" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match Version in pacproxy.go ($want)"
            exit 1
          fi

      - name: go test -race
        run: go test -race -count=1 ./...

      - name: Build
        run: make release

      - name: Package
        run: |
          mkdir dist
          cd build
          for d in */; do
            d=${d%/}
            case "$d" in
              *windows*) zip -qj "../dist/$d.zip" "$d"/* ;;
              *)         tar -czf "../dist/$d.tar.gz" -C "$d" . ;;
            esac
          done
          cd ../dist
          sha256sum * > SHA256SUMS
          ls -l

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > notes.md <<'EOF'
          Tested on macOS (Apple Silicon). Linux and Windows builds are provided but untested.

          On macOS, after extracting: `xattr -d com.apple.quarantine ./pacchain`
          EOF
          gh release create "$GITHUB_REF_NAME" dist/* \
            --title "$GITHUB_REF_NAME" --notes-file notes.md --verify-tag
